
name: Notify PR Reviewer

on:
  pull_request:
    types: [review_requested]

permissions:
  issues: write

jobs:
  notify-reviewer:
    if: github.event.requested_reviewer != null
    runs-on: ubuntu-latest

    steps:
      - name: Notify requested reviewer
        uses: actions/github-script@v7
        with:
          script: |
            const reviewer = context.payload.requested_reviewer.login;
            const prNumber = context.issue.number;

            const message = '@' + reviewer +
              ', a tua revisão deste Pull Request foi solicitada. ' +
              'Por favor, verifica as alterações quando estiveres disponível.';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: message
            });
